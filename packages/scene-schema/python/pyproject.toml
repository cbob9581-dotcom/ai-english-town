[project]
name = "scene-schema"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3", "jsonschema>=4.22"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scene_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
