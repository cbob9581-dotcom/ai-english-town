[project]
name = "app-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "scene-schema",
  "scene-compiler",
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "pytest-asyncio>=0.24,<1",
]

[tool.uv.sources]
scene-schema = { workspace = true }
scene-compiler = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
